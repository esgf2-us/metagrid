name: Container release

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

  pull_request:
    branches:
      - 'master'
      - 'v*-release'
      - 'v*-beta'
      - 'v*-alpha'

  workflow_dispatch:

permissions: {}

jobs:
  frontend:
    name: Build/release frontend container
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Source | Checkout
        uses: actions/checkout@v4
      - name: Docker | Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker | Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker | Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/esgf2-us/metagrid-frontend
          tags: |
            type=ref,event=pr
            type=ref,event=tag
      - name: Docker | Build and push
        uses: docker/build-push-action@v4
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: frontend/
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
  backend:
    name: Build/release backend container
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Source | Checkout
        uses: actions/checkout@v4
      - name: Docker | Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker | Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker | Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/esgf2-us/metagrid-backend
          tags: |
            type=ref,event=pr
            type=ref,event=tag
      - name: Docker | Build and push
        uses: docker/build-push-action@v4
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: backend/
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Source | Checkout
      uses: actions/checkout@v4
    - name: Helm | Setup
      uses: azure/setup-helm@v4.3.0
    - name: Helm | Lint chart
      run: |
        helm lint helm/
  test:
    name: Unittest Helm Chart
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Source | Checkout
      uses: actions/checkout@v4
    - name: Helm | Setup
      uses: azure/setup-helm@v4.2.0
      with:
        version: 'v3.19.2'
    - name: Helm | Install unittest plugin
      run: |
        helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 0.6.2
    - name: Helm | Run chart unittests
      working-directory: helm/
      run: helm unittest .
  test-deploy:
    name: Test Helm Chart deploy
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
    - name: Source | Checkout
      uses: actions/checkout@v4
    - name: Minikube | Start cluster
      uses: medyagh/setup-minikube@latest
    - name: Helm | Setup
      uses: azure/setup-helm@v4.2.0
    - name: Helm | Test chart installation
      working-directory: helm/
      run: |
        PR_NUMBER=$(echo ${GITHUB_REF} | awk -F'/' '{print $3}')

        helm install test . \
          --set wget.globusClientID="1234" \
          --set wget.globusClientSecret="1234" \
          --set frontend.image.tag=pr-${PR_NUMBER} \
          --set backend.image.tag=pr-${PR_NUMBER} \
          --wait

        kubectl get pods
  test-upgrade:
    name: Test Helm Chart upgrade
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
    - name: Source | Checkout
      uses: actions/checkout@v4
    - name: Minikube | Start cluster
      uses: medyagh/setup-minikube@latest
    - name: Helm | Setup
      uses: azure/setup-helm@v4.2.0
    - name: Helm | Test chart upgrade
      working-directory: helm/
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        helm install test oci://ghcr.io/esgf2-us/metagrid \
          --version `gh release list --json isLatest,tagName -q ".[] | select(.isLatest).tagName"` \
          --set wget.globusClientID="1234" \
          --set wget.globusClientSecret="1234" \
          --timeout 1m || echo

        kubectl get pods

        PR_NUMBER=$(echo ${GITHUB_REF} | awk -F'/' '{print $3}')

        helm upgrade test . \
          --set wget.globusClientID="1234" \
          --set wget.globusClientSecret="1234" \
          --set frontend.image.tag=pr-${PR_NUMBER} \
          --set backend.image.tag=pr-${PR_NUMBER} \
          --wait

        kubectl get pods
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: github.event_name != 'pull_request'
    steps:
    - name: Source | Checkout
      uses: actions/checkout@v4
    - name: Helm | Publish chart
      uses: appany/helm-oci-chart-releaser@v0.4.2
      with:
        name: metagrid
        repository: esgf2-us
        tag: ${{ github.ref_name }}
        path: helm
        registry: ghcr.io
        registry_username: ${{ github.actor }}
        registry_password: ${{ secrets.GITHUB_TOKEN }}
        update_dependencies: 'true'


