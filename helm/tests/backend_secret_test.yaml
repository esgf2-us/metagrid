suite: test backend secret
templates:
  - templates/backend/secret.yaml
release:
  name: metagrid
  namespace: production
chart:
  version: v1.0.0
  appVersion: v1.0.0
set:
  django:
    secretKey: abcd1234 # need static for checksum
tests:
  - it: should create a default secret
    template: templates/backend/secret.yaml
    asserts:
      - matchSnapshot: {}
  - it: should create a secret
    template: templates/backend/secret.yaml
    set:
      hotjar:
        id: 10
        sv: 20
      googleAnalyticsTrackingId: abcd1234
      django:
        admins:
          - user1
        adminUrl: /admin
    asserts:
      - matchSnapshot: {}
  - it: should disable authentication
    template: templates/backend/secret.yaml
    set:
      auth:
        enabled: false
    asserts:
      - isSubset:
          path: stringData
          content:
            DATABASE_URL: postgresql://postgres:postgres@metagrid-postgresql.production.svc:5432/postgres
            DJANGO_SECRET_KEY: abcd1234
  - it: should enable keycloak authentication
    template: templates/backend/secret.yaml
    set:
      auth:
        type: keycloak
        keycloak:
          url: https://keycloak.neworg.io
          realm: metagrid
          clientId: metagrid-production
    asserts:
      - isSubset:
          path: stringData
          content:
            DATABASE_URL: postgresql://postgres:postgres@metagrid-postgresql.production.svc:5432/postgres
            DJANGO_SECRET_KEY: abcd1234
            METAGRID_AUTHENTICATION_METHOD: keycloak
            METAGRID_KEYCLOAK_URL: https://keycloak.neworg.io
            METAGRID_KEYCLOAK_REALM: metagrid
            METAGRID_KEYCLOAK_CLIENT_ID: metagrid-production
