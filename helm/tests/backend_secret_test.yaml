suite: test backend secret
templates:
  - templates/backend/secret.yaml
release:
  name: metagrid
  namespace: production
chart:
  version: v1.0.0
  appVersion: v1.0.0
set:
  wget:
    globusClientID: test1234
    globusClientSecret: testSECRET1234
  django:
    secretKey: abcd1234 # need static for checksum
tests:
  - it: should create a default secret
    template: templates/backend/secret.yaml
    asserts:
      - matchSnapshot: {}
  - it: should create a secret
    template: templates/backend/secret.yaml
    set:
      hotjar:
        id: 10
        sv: 20
      googleAnalyticsTrackingId: abcd1234
      django:
        admins:
          - user1
        adminUrl: /admin
    asserts:
      - matchSnapshot: {}
  - it: should disable authentication
    template: templates/backend/secret.yaml
    set:
      auth:
        enabled: false
    asserts:
      - isSubset:
          path: stringData
          content:
            DATABASE_URL: postgresql://postgres:postgres@metagrid-postgresql.production.svc:5432/postgres
            DJANGO_SECRET_KEY: abcd1234
  - it: should enable keycloak authentication
    template: templates/backend/secret.yaml
    set:
      auth:
        type: keycloak
        keycloak:
          url: https://keycloak.neworg.io
          realm: metagrid
          clientId: metagrid-production
    asserts:
      - isSubset:
          path: stringData
          content:
            DATABASE_URL: postgresql://postgres:postgres@metagrid-postgresql.production.svc:5432/postgres
            DJANGO_SECRET_KEY: abcd1234
            METAGRID_AUTHENTICATION_METHOD: keycloak
            METAGRID_KEYCLOAK_URL: https://keycloak.neworg.io
            METAGRID_KEYCLOAK_REALM: metagrid
            METAGRID_KEYCLOAK_CLIENT_ID: metagrid-production
  - it: should append additional secret
    template: templates/backend/secret.yaml
    set:
      django:
        secret:
          API_KEY: ooppppps
    asserts:
      - isSubset:
          path: stringData
          content:
            API_KEY: "ooppppps"
  - it: should require either globus auth or explicit globus secret for wget
    template: templates/backend/secret.yaml
    set:
      wget:
        globusClientID:
        globusClientSecret:
    asserts:
      - failedTemplate:
          errorMessage: "Either wget.globusClientID/wget.globusClientSecret or auth.globus.key/auth.globus.secret must be defined when wget.url is not set"
  - it: should require both
    template: templates/backend/secret.yaml
    set:
      wget:
        globusClientID:
    asserts:
      - failedTemplate:
          errorMessage: "Either wget.globusClientID/wget.globusClientSecret or auth.globus.key/auth.globus.secret must be defined when wget.url is not set"
  - it: should use globus auth for wget
    template: templates/backend/secret.yaml
    asserts:
      - isSubset:
          path: stringData
          content:
            GLOBUS_CLI_CLIENT_ID: test1234
            GLOBUS_CLI_CLIENT_SECRET: testSECRET1234
  - it: should use globus auth for wget
    template: templates/backend/secret.yaml
    set:
      wget:
        globusClientID:
        globusClientSecret:
      auth:
        globus:
          key: auth_test1234
          secret: auth_testSECRET1234
    asserts:
      - isSubset:
          path: stringData
          content:
            GLOBUS_CLI_CLIENT_ID: auth_test1234
            GLOBUS_CLI_CLIENT_SECRET: auth_testSECRET1234
