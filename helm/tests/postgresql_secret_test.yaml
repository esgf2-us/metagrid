suite: test postgresql secret
templates:
  - templates/backend/secret.yaml
  - templates/postgresql/secret.yaml
release:
  name: metagrid
  namespace: production
chart:
  version: v1.0.0
  appVersion: v1.0.0
set:
  wget:
    globusClientID: test1234
    globusClientSecret: test1234
  django:
    secretKey: abcd1234 # need static for checksum
tests:
  - it: should create a default secret
    template: templates/postgresql/secret.yaml
    asserts:
      - matchSnapshot: {}
  - it: should create a secret
    template: templates/postgresql/secret.yaml
    set:
      postgresql:
        username: admin
        password: abcd1234
        database: metagrid-test
    asserts:
      - isSubset:
          path: stringData
          content:
            POSTGRES_DB: metagrid-test
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: abcd1234
      - equal:
          path: stringData.DATABASE_URL
          value: postgresql://admin:abcd1234@metagrid-postgresql.production.svc:5432/metagrid-test
        template: templates/backend/secret.yaml
