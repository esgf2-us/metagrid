suite: test backend hpa
templates:
  - templates/backend/hpa.yaml
release:
  name: metagrid
  namespace: production
chart:
  version: v1.0.0
  appVersion: v1.0.0
set:
  django:
    secretKey: abcd1234 # need static for checksum
tests:
  - it: should create horizontal pod autoscaler
    template: templates/backend/hpa.yaml
    set:
      backend:
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
          targetCPUUtilizationPercentage: 45
          targetMemoryUtilizationPercentage: 500Mi
    asserts:
      - matchSnapshot: {}
