nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: false
  tls: false
  host:
  additionalHost:
  className: ""
  labels: {}
  annotations: {}

features:
  nodeStatus:
    enabled: true
    url:
  wget:
    enabled: true

    uploadMaxFields: 1024
    globusPublicIndex: a8ef4320-9e5a-4793-837b-c45161ca1845
    limit:
      default: 9999
      limit: 100000
    maxDirLength: 50

config:
  GUNICORN_WORKERS: '2'
  METAGRID_SEARCH_URL: https://esgf-node.ornl.gov/esgf-1-5-bridge
  # METAGRID_WGET_URL: https://nimbus.llnl.gov/wget
  # TODO implement logic to require these when using globus only, for now adding placeholders
  METAGRID_SOCIAL_AUTH_GLOBUS_KEY: "key"
  METAGRID_SOCIAL_AUTH_GLOBUS_SECRET: "secret"
  # BANNER_TEXT:
  # SUPPORT_INFO:
  # FOOTER_TEXT:

frontend:
  replicaCount: 1

  image:
    repository: ghcr.io/esgf2-us/metagrid-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []

  serviceAccount:
    create: true
    automount: false
    annotations: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 8080

  resources: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

backend:
  admin:
    create: false
  migrateJob:
    enabled: true
    backoffLimit: 4

  projects: # Example projects
  #
  # projects: |
  #   group_descriptions = {
  #     "General": "Least verbose, typically returns many results",
  #   }
  #   projects = [
  #     {
  #       "name": "Example",
  #       "full_name": "Example project",
  #       ...
  #       "facets_by_group": {
  #         "General": ["activity_id", "data_node"],
  #       }
  #     }
  #   ]

  replicaCount: 1

  image:
    repository: ghcr.io/esgf2-us/metagrid-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []

  serviceAccount:
    create: true
    automount: false
    annotations: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  service:
    type: ClusterIP
    port: 5000

  resources: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

postgresql:
  enabled: true

  username: postgres
  password: postgres
  database: postgres

  imagePullSecrets: []

  image:
    repository: postgres
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: 16.10-bookworm

  serviceAccount:
    create: true

  service:
    port: 5432

  persistence:
    enabled: true

    accessMode: ReadWriteOnce
    size: 8Gi
    storageClassName:

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

nodeStatusBackend:
  enabled: true

  replicaCount: 1
  podAnnotations: {}
  podLabels: {}

  serviceAccount:
    create: true
    automount: false
    annotations: {}

  imagePullSecrets: []
  podSecurityContext: {}
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  service:
    type: ClusterIP
    port: 9090

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  prometheus:
    image:
      repository: quay.io/prometheus/prometheus
      pullPolicy: IfNotPresent
      tag: latest

    volumes: []
    securityContext: {}
    resources: {}

  blackbox:
    image:
      repository: quay.io/prometheus/blackbox-exporter
      pullPolicy: IfNotPresent
      tag: latest

    volumes: []
    securityContext: {}
    resources: {}
