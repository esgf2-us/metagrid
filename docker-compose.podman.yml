# Podman-specific production configuration
# Applies Podman-specific settings on top of base compose files
#
# Key differences from Docker deployment:
# - Traefik uses Docker provider with Podman socket (bypasses DNS issues)
# - Containers run as root (user: 0:0) for pre-built image compatibility
# - Standard ports 80/443 (requires rootful Podman with sudo)
# - Traefik labels for dynamic service discovery via Podman API

volumes:
  traefik_certs: {}

services:
  traefik:
    restart: unless-stopped
    volumes:
      - traefik_certs:/etc/traefik/acme
      # Use Podman-specific config with Docker provider (bypasses DNS)
      - ./traefik/traefik.podman.yml:/etc/traefik/traefik.yml:ro
      # Mount Podman socket for Docker provider
      - /run/podman/podman.sock:/var/run/podman/podman.sock:ro
      # Mount custom certificates directory if using custom certs (traefik.customcert.yml)
      - ./traefik/certs:/etc/traefik/certs:ro
    ports:
      - '0.0.0.0:80:9080' # HTTP on standard port
      - '0.0.0.0:443:9443' # HTTPS on standard port

  docs:
    profiles: ['docs']
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports: [] # Remove port binding - internal access only

  django:
    restart: unless-stopped
    user: '0:0' # Run as root in container to avoid permission issues with pre-built images
    ports: [] # Remove port binding - accessed through traefik only via container network
    depends_on:
      postgres:
        condition: service_started
    # Traefik Docker provider labels
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`${DOMAIN_NAME}`) && (PathPrefix(`/account-confirm-email`) || PathPrefix(`/accounts`) || PathPrefix(`/api`) || PathPrefix(`/complete`) || PathPrefix(`/frontend-config.js`) || PathPrefix(`/globus`) || PathPrefix(`/login`) || PathPrefix(`/proxy`) || PathPrefix(`/redoc`) || PathPrefix(`/swagger`) || PathPrefix(`/tempStorage`))"
      - "traefik.http.routers.django.entrypoints=web-secure"
      - "traefik.http.routers.django.tls=true"
      - "traefik.http.services.django.loadbalancer.server.port=5000"

  react:
    image: metagrid_prod_react
    build:
      context: ./frontend
      target: prod
    command: []
    restart: unless-stopped
    user: '0:0' # Run as root in container to avoid permission issues with pre-built images
    volumes:
      - ./frontend/public/projects/projects.json:/usr/share/nginx/html/projects/projects.json:ro
    ports: [] # Remove port binding - accessed through traefik only
    # Traefik Docker provider labels
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.react.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.react.entrypoints=web-secure"
      - "traefik.http.routers.react.tls=true"
      - "traefik.http.services.react.loadbalancer.server.port=8080"

  keycloak:
    profiles: ['keycloak']
    command: start --import-realm
    volumes: []
    restart: unless-stopped
