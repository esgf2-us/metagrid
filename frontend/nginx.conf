server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # route any urls that aren't specified to index.html
        # ref: https://stackoverflow.com/a/43557288/4075135
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of projects.json so changes take effect immediately
    location = /projects/projects.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # enables collection of Prometheus metrics
    location = /metrics {
        stub_status;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
