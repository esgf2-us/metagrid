volumes:
  local_postgres_data: {}
  local_postgres_data_backups: {}

services:
  traefik:
    container_name: traefik
    image: traefik:3.3
    volumes:
      - ./traefik/traefik.local.yml:/etc/traefik/traefik.yml
    environment:
      DOMAIN_NAME: localhost
    ports:
      - '9080:9080'
      - '9443:9443'

  docs:
    container_name: docs
    profiles: ['docs']
    build: docs
    image: metagrid_local_docs
    volumes:
      - ./docs:/docs
    ports:
      - 8001:8001

  postgres:
    container_name: postgres
    build: postgres
    image: metagrid_local_postgres
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - local_postgres_data_backups:/local_postgres_data_backups
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '127.0.0.1:5432:5432'
    depends_on:
      - traefik
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'postgres']
      start_period: 5s
      interval: 5s
      timeout: 2s
      retries: 6

  django:
    container_name: django
    build: backend
    image: metagrid_local_django
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      WGET_SCRIPT_FILE_DEFAULT_LIMIT: 9999
    ports:
      - '127.0.0.1:5000:5000'

  react:
    container_name: react
    build:
      context: frontend
      target: build
    image: metagrid_local_react
    environment:
      PORT: 8080
      VITE_FEDERATED_NODES_URL: 'https://esgf.github.io/nodes.html'
    depends_on:
      - django
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '127.0.0.1:8080:8080'

  keycloak:
    profiles: ['keycloak']
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.1.2
    depends_on:
      - react
    command: start-dev --import-realm
    ports:
      - '127.0.0.1:1337:1337'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: '1337'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
