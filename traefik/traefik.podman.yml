# Traefik configuration for Podman with Docker provider
# Uses Podman socket to discover containers dynamically - no DNS needed
#
# This config is used by docker-compose.podman.yml and should handle both:
# - Let's Encrypt automatic certificates (default)
# - Custom certificates when CERT_FILES_EXIST environment variable is set

log:
  level: INFO

entryPoints:
  web:
    address: ':9080'
  web-secure:
    address: ':9443'

providers:
  # Use Docker provider to discover containers via Podman socket
  docker:
    endpoint: "unix:///var/run/podman/podman.sock"
    exposedByDefault: false
    network: "metagrid_default"

# Certificate resolver for Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@example.com"
      storage: /etc/traefik/acme/acme.json
      tlsChallenge: {}

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
