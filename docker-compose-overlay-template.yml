# Notes:
# - Replace any <VAR_NAME> placeholders with real values before deploying.
# - Multi-line placeholders are kept as literal blocks; replace the single-line placeholder text with your multi-line content.
# - If you prefer to manage DB credentials outside of the overlay, remove or adjust the postgres block accordingly.

services:
  traefik:
    # SSL Certificate Configuration - Choose ONE option:
    #
    # OPTION 1: Let's Encrypt (automatic SSL, default)
    # Uncomment the LETSENCRYPT_EMAIL line below:
    environment:
      DOMAIN_NAME: <DOMAIN_NAME>
      LETSENCRYPT_EMAIL: <YOUR_EMAIL>
    #
    # OPTION 2: Use your own SSL certificate
    # 1. Comment out or remove the LETSENCRYPT_EMAIL line above
    # 2. Replace the traefik config volume mount to use traefik.prod.custom-ssl.yml:
    #    - ./traefik/traefik.prod.custom-ssl.yml:/etc/traefik/traefik.yml
    # 3. Uncomment and configure the lines below:
    # environment:
    #   DOMAIN_NAME: <DOMAIN_NAME>
    #   SSL_CERT_FILE: /etc/traefik/certs/certificate.crt
    #   SSL_KEY_FILE: /etc/traefik/certs/private.key
    # volumes:
    #   - /path/on/host/to/certificate.crt:/etc/traefik/certs/certificate.crt:ro
    #   - /path/on/host/to/private.key:/etc/traefik/certs/private.key:ro
    #   - ./traefik/traefik.prod.custom-ssl.yml:/etc/traefik/traefik.yml

  postgres:
    # Keep the postgres service so overlays can set password / healthcheck consistently
    environment:
      POSTGRES_USER: <POSTGRES_USER>
      POSTGRES_PASSWORD: <POSTGRES_PASSWORD>
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '<POSTGRES_USER>', '-d', '<POSTGRES_PASSWORD>']

  django:
    environment:
      # Core site / Django settings
      DOMAIN_NAME: <DOMAIN_NAME>
      DJANGO_ALLOWED_HOSTS: '["<DOMAIN_NAME>", "localhost"]'
      DJANGO_SECRET_KEY: <DJANGO_SECRET_KEY>
      DJANGO_DATABASE_URL: "postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/postgres"

      # Backend / frontend integration URLs (use defaults where known, otherwise placeholders)
      METAGRID_SEARCH_URL: https://esgf-node.ornl.gov/esgf-1-5-bridge
      METAGRID_STAC_URL: <METAGRID_STAC_URL>
      METAGRID_WGET_URL: <METAGRID_WGET_URL>
      METAGRID_STATUS_URL: <METAGRID_STATUS_URL>

      # Globus / auth
      METAGRID_GLOBUS_NODES: '["esgf-node.ornl.gov", "eagle.alcf.anl.gov", "esgf-data.nersc.gov"]'
      METAGRID_GLOBUS_CLIENT_ID: <METAGRID_GLOBUS_CLIENT_ID>
      METAGRID_SOCIAL_AUTH_GLOBUS_KEY: <METAGRID_SOCIAL_AUTH_GLOBUS_KEY>
      METAGRID_SOCIAL_AUTH_GLOBUS_SECRET: <METAGRID_SOCIAL_AUTH_GLOBUS_SECRET>
      METAGRID_AUTHENTICATION_METHOD: none

      # Pagination / limits / wget config
      METAGRID_DATA_UPLOAD_MAX_NUMBER_FIELDS: 1024
      METAGRID_GLOBUS_PUBLIC_INDEX_ENDPOINT_ID: a8ef4320-9e5a-4793-837b-c45161ca1845
      METAGRID_WGET_SCRIPT_FILE_DEFAULT_LIMIT: 9999
      METAGRID_WGET_SCRIPT_FILE_MAX_LIMIT: 100000
      METAGRID_WGET_MAX_DIR_LENGTH: 50

      # Multi-line / Markdown fields (use YAML literal blocks). Replace placeholders if not provided.
      METAGRID_FOOTER_TEXT: |
        <METAGRID_FOOTER_TEXT>
      METAGRID_BANNER_TEXT: |
        <METAGRID_BANNER_TEXT>
      METAGRID_SUPPORT_INFO: |
        <METAGRID_SUPPORT_INFO>

      # Third-party integrations and analytics
      METAGRID_HOTJAR_ID: <METAGRID_HOTJAR_ID>
      METAGRID_HOTJAR_SV: <METAGRID_HOTJAR_SV>
      METAGRID_GOOGLE_ANALYTICS_TRACKING_ID: <METAGRID_GOOGLE_ANALYTICS_TRACKING_ID>

      # Admin / maintenance
      METAGRID_ADMIN_URL: <METAGRID_ADMIN_URL>
      METAGRID_ADMINS: [] # e.g. [("Admin","admin@example.com")]

      # Keycloak (optional)
      METAGRID_KEYCLOAK_URL: <METAGRID_KEYCLOAK_URL>
      METAGRID_KEYCLOAK_REALM: <METAGRID_KEYCLOAK_REALM>
      METAGRID_KEYCLOAK_CLIENT_ID: <METAGRID_KEYCLOAK_CLIENT_ID>

  react:
    environment:
      # Frontend-specific Vite environment variables
      VITE_FEDERATED_NODES_URL: 'https://esgf.github.io/nodes.html'

  keycloak:
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
