# Podman + Custom Certificate overlay
# Use this when deploying with Podman AND custom SSL certificates
# Applied after docker-compose.podman.yml to add certificate configuration

services:
  traefik:
    command:
      # Inherit Docker provider commands from podman.yml, add cert config
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/podman/podman.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=metagrid_default"
      - "--providers.file.filename=/etc/traefik/dynamic-certs.yml"
      - "--providers.file.watch=false"
    volumes:
      # Add dynamic config for custom certificates
      - ./traefik/traefik.podman.customcert-dynamic.yml:/etc/traefik/dynamic-certs.yml:ro
